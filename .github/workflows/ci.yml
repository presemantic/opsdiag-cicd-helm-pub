name: "opsdiag-helm-pub"

on:
  workflow_dispatch:
    inputs:
      VERSION_TAG:
        description: Version tag to package, if not set latest timestamp tag will be used
        required: true
        type: string
        default: '2025-01-01.01-01-01.aaaaaa'
  push:
    tags:
      - '20*'

permissions:
  contents: read

env:
  REGION: europe-west1
  GAR_LOCATION: europe-west1-docker.pkg.dev/prod-common-cicd/opsdiag-helm-pub

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - opsdiag-app
          - opsdiag-app-connector
    steps:
      - name: "[Checkout] Build"
        uses: actions/checkout@v4
        with:
          path: build

      - name: "[Versioner] Get version from latest tag"
        working-directory: build
        env:
          MANUAL_VERSION_TAG: ${{ github.event.inputs.VERSION_TAG }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          base_version_regex='^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]{2}-[0-9]{2}-[0-9]{2}\.[0-9a-z]+$'

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" =~ ${base_version_regex} ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${MANUAL_VERSION_TAG}" ] && [[ "${MANUAL_VERSION_TAG}" =~ ${base_version_regex} ]]; then
            VERSION_TAG="${MANUAL_VERSION_TAG}"
          else
            git fetch --tags
            VERSION_TAG="$(git tag --sort=committerdate | grep -Ei "${base_version_regex}" | tail -1)"
          fi

          if [ -z "${VERSION_TAG}" ]; then
            echo "Tag not found"
            exit 1
          fi

          echo "VERSION_TAG=${VERSION_TAG}" >>"${GITHUB_ENV}"

      - name: "[Versioner] Print fetch version"
        run: |
          echo "Version fetched: ${{ env.VERSION_TAG }}"

      - name: "[Checkout] Checkout to Tag"
        uses: actions/checkout@v4
        with:
          path: build
          ref: ${{ env.VERSION_TAG }}

      - name: "[Helm] Setup"
        uses: azure/setup-helm@v4

      - name: "[GOOGLE] Setup Credentials"
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_ARTIFACT_REGISTRY_KEY }}"
          token_format: "access_token"

      - name: "[GOOGLE] Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: "[GOOGLE] Use gcloud CLI"
        run: "gcloud info"

      - name: "[Helm] Registry auth"
        run: |
          echo "${{ steps.gcp-auth.outputs.access_token }}" | helm registry login \
            -u oauth2accesstoken \
            --password-stdin \
            "${{ env.REGION }}-docker.pkg.dev"

      - name: "[Helm] Verify vendored dependencies"
        run: |
          helm dependency list "build/${{ matrix.chart }}"

      - name: "[Helm] Lint"
        run: |
          if [ "${{ matrix.chart }}" = "opsdiag-app" ]; then
            helm lint "build/${{ matrix.chart }}" --values "build/${{ matrix.chart }}/ci-values.yaml"
          else
            helm lint "build/${{ matrix.chart }}"
          fi

      - name: "[Helm] Enforce readable templates"
        run: |
          set -euo pipefail
          chart="build/${{ matrix.chart }}"

          if grep -REn '\{\{[^}]*[[:space:]](deepCopy|set|unset|mergeOverwrite)[[:space:](]' "${chart}/templates"; then
            echo "Owned templates must not mutate copied values."
            exit 1
          fi

          if grep -REn '^kind: (PodDisruptionBudget|NetworkPolicy)$|extraDeploy|extra-list' "${chart}/templates" "${chart}/values.yaml"; then
            echo "PDB, NetworkPolicy, and arbitrary extraDeploy renderers are not supported."
            exit 1
          fi

          while IFS= read -r template; do
            if awk '
              FNR == 1 { seen_api = 0 }
              /^apiVersion:/ { seen_api = 1 }
              !seen_api && /\{\{-? *\$[^:]*:=/ { print FILENAME ":" FNR ":" $0; found = 1 }
              END { exit found ? 0 : 1 }
            ' "${template}"; then
              echo "Resource templates must not declare variables before apiVersion."
              exit 1
            fi
          done < <(find "${chart}/templates" -type f -name '*.yaml' -print)

          if [ "${{ matrix.chart }}" = "opsdiag-app" ]; then
            if tar -tzf "${chart}/charts/apisix-2.16.0.tgz" | grep -Ei '/templates/.*(pdb|poddisruptionbudget|networkpolicy)'; then
              echo "The committed APISIX archive must not contain PDB or NetworkPolicy templates."
              exit 1
            fi

            rendered="$(helm template opsdiag "${chart}" --values "${chart}/ci-values.yaml")"
            printf '%s\n' "${rendered}" | grep -q 'image: "registry-1.docker.io/library/postgres:18"'
            printf '%s\n' "${rendered}" | grep -q 'name: "opsdiag-pgsql-v18"'
            printf '%s\n' "${rendered}" | grep -q 'name: "opsdiag-pgsql-tables-v18"'
            test "$(printf '%s\n' "${rendered}" | grep -c '^kind: StatefulSet$')" -eq 2
          else
            rendered="$(helm template opsdiag "${chart}")"
          fi

          if printf '%s\n' "${rendered}" | grep -Eq '^kind: (PodDisruptionBudget|NetworkPolicy)$'; then
            echo "A forbidden PDB or NetworkPolicy was rendered."
            exit 1
          fi

      - name: "[Helm] Package"
        run: |
          mkdir -p dist
          helm package "build/${{ matrix.chart }}" --destination dist

      - name: "[Helm] Push"
        run: |
          helm push dist/${{ matrix.chart }}-*.tgz "oci://${GAR_LOCATION}"
