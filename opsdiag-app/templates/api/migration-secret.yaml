{{- if .Values.api.migration.enabled }}
{{- $apiConfig := deepCopy .Values.api.config -}}
{{- $_ := set $apiConfig.database "url" (include "opsdiag-app.databaseURL" .) -}}
{{- $_ := set $apiConfig.tablesDatabase "url" (include "opsdiag-app.tablesDatabaseURL" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-migrate-config" (include "opsdiag-app.componentName" (dict "root" . "component" "api")) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "opsdiag-app.podLabels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  config.yaml: |
    {{- include "common.tplvalues.render" (dict "value" ($apiConfig | toYaml) "context" $) | nindent 4 }}
{{- end }}
