apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsolving-app.componentName" (dict "root" . "component" "agent") }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "opsolving-app.podLabels" (dict "root" . "component" "agent") | nindent 4 }}
  {{- with .Values.agent.service.annotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agent.service.type }}
  {{- with .Values.agent.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.agent.service.ports.http }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "opsolving-app.selectorLabels" (dict "root" . "component" "agent") | nindent 4 }}
