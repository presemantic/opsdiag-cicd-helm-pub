{{- if .Values.front.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsolving-app.serviceAccountName" (dict "root" . "component" "front") }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "opsolving-app.podLabels" (dict "root" . "component" "front") | nindent 4 }}
  {{- if .Values.front.serviceAccount.annotations }}
  annotations:
    {{- with .Values.front.serviceAccount.annotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.front.serviceAccount.automountServiceAccountToken }}
{{- end }}
