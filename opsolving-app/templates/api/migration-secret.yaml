{{- if .Values.api.migration.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-migrate-config" (include "opsolving-app.componentName" (dict "root" . "component" "api")) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "opsolving-app.podLabels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-11"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- with .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "common.tplvalues.render" (dict "value" (omit .Values.api.config "database" "tablesDatabase" | toYaml) "context" $) | nindent 4 }}
    database:
      {{- with (omit .Values.api.config.database "url") }}
      {{- include "common.tplvalues.render" (dict "value" (. | toYaml) "context" $) | nindent 6 }}
      {{- end }}
      url: {{ include "opsolving-app.pgsql.url" . | quote }}
    tablesDatabase:
      {{- with (omit .Values.api.config.tablesDatabase "url") }}
      {{- include "common.tplvalues.render" (dict "value" (. | toYaml) "context" $) | nindent 6 }}
      {{- end }}
      url: {{ include "opsolving-app.pgsqlTables.url" . | quote }}
{{- end }}
